<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF4F1">
<title>Petualangan Malika dan Keandra 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pri:#4E9381;--soft:#E6F2EE;--peach:#F0A88F;--mint:#BFE0D6;--sky:#9DC3E6;--text:#3E4A4F;--tl:#7C8A8F;--w:#fff;--ok:#5BA67A;--warn:#E8B866;--err:#D98080;--line:#DCE5E2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(160deg,#EEF4F1,#E7EFF4);min-height:100vh;color:var(--text);overflow-x:hidden}
.screen{display:none;min-height:100vh;padding:16px 16px 110px}.screen.active{display:block}
h2{font-size:22px;font-weight:800;margin:0 0 8px}h3{font-size:18px;font-weight:800;margin:0 0 8px}p{margin:4px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border:none;border-radius:22px;font:800 17px inherit;font-family:inherit;color:var(--w);cursor:pointer;width:100%;margin:6px 0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn-primary{background:var(--pri)}.btn-secondary{background:var(--sky)}.btn-danger{background:var(--err)}.btn-warn{background:var(--warn);color:#6b4a12}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:14px;width:auto;margin:0}
.btn-ghost{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--line)}
.card{background:var(--w);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 3px 10px rgba(80,110,110,.10)}
.t-pink{background:var(--soft);border-left:6px solid var(--pri)}.t-mint{background:#F0FFF8;border-left:6px solid var(--mint)}.t-yellow{background:#FFFCF0;border-left:6px solid #FFDAC1}
input,select{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--w);font-family:inherit;font-size:16px;font-weight:600;color:var(--text);margin:6px 0;outline:none}
input:focus,select:focus{border-color:var(--pri)}
label{font-weight:700;color:var(--tl);font-size:14px;margin-top:8px;display:block}
.hero{text-align:center;padding:40px 0 20px}.hero h1{font-size:26px;font-weight:900;margin:0}
.hero-icon{font-size:80px;display:inline-block;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.sub{color:var(--tl);font-size:13px}
#screen-loading.active{display:flex;align-items:center;justify-content:center;flex-direction:column}
.spinner{font-size:60px;animation:sp 1.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--w);border-radius:24px 24px 0 0;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(160,140,170,.15);z-index:50;overflow-x:auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:none;background:none;font:700 10px inherit;font-family:inherit;color:var(--tl);cursor:pointer;min-width:56px;border-radius:14px;flex-shrink:0}
.nav-icon{font-size:22px}.nav-item.active{color:var(--pri);background:var(--soft)}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.avatar-btn{aspect-ratio:1;border-radius:18px;border:3px solid transparent;background:#F8F4FA;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.avatar-btn.selected{border-color:var(--pri);background:var(--soft)}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:10px 0}
.color-btn{aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer}.color-btn.selected{border-color:var(--text);transform:scale(1.15)}
.child-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--w);border-radius:22px;margin:10px 0;cursor:pointer;box-shadow:0 3px 10px rgba(80,110,110,.10)}
.child-avatar{font-size:40px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.task-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--w);border-radius:20px;margin:8px 0;box-shadow:0 3px 8px rgba(160,140,170,.1)}
.task-card.done{opacity:.75;background:#F8FFF8}.task-card.pending{background:#FFFBF0}
.task-icon{font-size:30px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--soft);flex-shrink:0}
.task-body{flex:1;min-width:0;font-weight:800;font-size:15px}.pts{font-size:13px;font-weight:700;color:var(--pri)}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;flex-shrink:0}
.b-pend{background:#FFF4E0;color:#B07700}.b-ok{background:#E8F8EC;color:#2b6b53}
.balance-box{background:linear-gradient(135deg,#4E9381,#76B5A4);border-radius:26px;padding:24px;text-align:center;color:var(--w);margin:12px 0}
.balance-num{font-size:56px;font-weight:900;line-height:1}
.reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reward-card{background:var(--w);border-radius:22px;padding:16px;text-align:center;box-shadow:0 3px 10px rgba(80,110,110,.10)}
.reward-name{font-weight:800;font-size:14px;min-height:36px}
.empty{text-align:center;padding:30px 20px;color:var(--tl)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--text);color:var(--w);padding:14px 22px;border-radius:18px;font-weight:700;font-size:14px;z-index:200;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%)}.toast.success{background:var(--ok)}.toast.error{background:var(--err)}
.modal-root{position:fixed;inset:0;background:rgba(60,40,70,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-root.active{display:flex}
.modal-content{background:var(--w);border-radius:28px 28px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.hdr{display:flex;align-items:center;gap:12px;padding:8px 0 12px}.hdr-av{font-size:44px}.hdr-info{flex:1;font-weight:900;font-size:20px}
.sec{font-weight:900;font-size:15px;margin:16px 0 8px;color:var(--tl)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin:4px 0}
.tab{flex-shrink:0;padding:10px 14px;border-radius:14px;border:none;background:var(--w);font:800 13px inherit;font-family:inherit;color:var(--tl);cursor:pointer;box-shadow:0 2px 6px rgba(160,140,170,.1)}
.tab.active{background:var(--pri);color:var(--w)}
.row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--w);border-radius:18px;margin:8px 0;box-shadow:0 3px 8px rgba(160,140,170,.1)}
.row-icon{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:12px;flex-shrink:0}
.row-body{flex:1;min-width:0;font-weight:800;font-size:14px}.acts{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:50%;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib.ok{background:#E8F8EC;color:#2b6b53}.ib.no{background:#FFEBEE;color:#c62828}
.fid{background:var(--text);color:var(--w);padding:14px;border-radius:16px;text-align:center;margin:8px 0}
.fid b{display:block;font-size:22px;letter-spacing:1.5px;margin:4px 0}
/* TABEL JADWAL */
.st{width:100%;border-collapse:collapse;background:var(--w);font-size:13px;margin:8px 0}
.st th,.st td{border:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
.st th{background:var(--soft);font-weight:800}.st .tm{white-space:nowrap;font-weight:700}.st .nt{font-style:italic;color:var(--tl)}
.st .ac{white-space:nowrap}.st .ac .ib{display:inline-flex;width:30px;height:30px;font-size:14px}
.seg{display:flex;gap:6px}.seg .tab{flex:1;white-space:normal}
.two{display:flex;gap:10px}.two>div{flex:1}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}.chk input{width:auto;margin:0}
</style>
</head>
<body>

<div id="screen-loading" class="screen active"><div class="spinner">🐶</div><p class="sub">Menyiapkan petualangan...</p></div>

<div id="screen-onboarding" class="screen">
  <div class="hero"><div class="hero-icon">🐾</div><h1>Petualangan Malika dan Keandra</h1><p class="sub">Jadwal harian, tugas, poin, dan hadiah</p></div>
  <button class="btn btn-primary" data-action="go-create">🏠 Buat Keluarga Baru</button>
  <button class="btn btn-secondary" data-action="go-join">🔗 Gabung Keluarga</button>
</div>

<div id="screen-create" class="screen">
  <h2>🏠 Buat Keluarga Baru</h2>
  <form id="form-create">
    <label>Nama Keluarga</label><input id="c-fam" required maxlength="40" placeholder="Keluarga Ceria">
    <label>Nama Kamu</label><input id="c-name" required maxlength="20" placeholder="Ayah / Ibu">
    <label>PIN Orang Tua (4-6 angka)</label><input id="c-pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required maxlength="6">
    <label>Ulangi PIN</label><input id="c-pin2" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required maxlength="6">
    <button type="submit" class="btn btn-primary" style="margin-top:16px">Buat Keluarga</button>
    <button type="button" class="btn btn-ghost" data-action="back">Kembali</button>
  </form>
</div>

<div id="screen-join" class="screen">
  <h2>🔗 Gabung Keluarga</h2>
  <p class="sub">Minta ID keluarga dari orang tua. Anak tidak perlu PIN.</p>
  <form id="form-join">
    <label>ID Keluarga</label><input id="j-fid" required maxlength="20" placeholder="FAM-XXXXXXXX" style="text-transform:uppercase">
    <button type="submit" class="btn btn-primary" style="margin-top:16px">Lanjut</button>
    <button type="button" class="btn btn-ghost" data-action="back">Kembali</button>
  </form>
</div>

<div id="screen-landing" class="screen">
  <div class="hero"><div class="hero-icon">🐾</div><h1>Petualangan Malika dan Keandra</h1><p class="sub" id="land-fam"></p></div>
  <h2 style="text-align:center;margin:8px 0 16px">Kamu siapa hari ini?</h2>
  <button class="btn btn-primary" style="padding:24px" data-action="land-parent">👨‍👩‍👧 Aku Orang Tua</button>
  <button class="btn btn-secondary" style="padding:24px" data-action="land-child">🧒 Aku Anak</button>
  <button class="btn btn-ghost" style="margin-top:28px;font-size:14px" data-action="reset-device">Ganti keluarga / keluar dari HP ini</button>
</div>

<div id="screen-pick-child" class="screen"><h2>Pilih Profilmu</h2><p class="sub">Ketuk namamu.</p><div id="pick-list"></div><button class="btn btn-ghost" data-action="go-landing">Kembali</button></div>

<div id="screen-child" class="screen">
  <div id="child-header"></div><div id="child-body"></div>
  <nav class="bottom-nav" id="child-nav">
    <button class="nav-item" data-action="child-tab" data-tab="today"><span class="nav-icon">📅</span>Hari Ini</button>
    <button class="nav-item" data-action="child-tab" data-tab="week"><span class="nav-icon">🗓️</span>Jadwal</button>
    <button class="nav-item" data-action="child-tab" data-tab="tasks"><span class="nav-icon">✅</span>Tugas</button>
    <button class="nav-item" data-action="child-tab" data-tab="rewards"><span class="nav-icon">🎁</span>Hadiah</button>
    <button class="nav-item" data-action="child-tab" data-tab="points"><span class="nav-icon">⭐</span>Poin</button>
  </nav>
</div>

<div id="screen-parent" class="screen">
  <div id="parent-header"></div><div id="parent-body"></div>
  <nav class="bottom-nav" id="parent-nav">
    <button class="nav-item" data-action="parent-tab" data-tab="approval"><span class="nav-icon">✅</span>Setujui</button>
    <button class="nav-item" data-action="parent-tab" data-tab="schedule"><span class="nav-icon">🗓️</span>Jadwal</button>
    <button class="nav-item" data-action="parent-tab" data-tab="tasks"><span class="nav-icon">📝</span>Tugas</button>
    <button class="nav-item" data-action="parent-tab" data-tab="rewards"><span class="nav-icon">🎁</span>Hadiah</button>
    <button class="nav-item" data-action="parent-tab" data-tab="children"><span class="nav-icon">🧒</span>Anak</button>
    <button class="nav-item" data-action="parent-tab" data-tab="more"><span class="nav-icon">⚙️</span>Lain</button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<div id="modal-root" class="modal-root" data-action="close-modal-bg"><div class="modal-content" id="modal-content"></div></div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAWVFJtJ_k5Ov-Awdg3vUNZAWRUYrB8Jow",
  authDomain: "my-task-and-schedule.firebaseapp.com",
  projectId: "my-task-and-schedule",
  storageBucket: "my-task-and-schedule.firebasestorage.app",
  messagingSenderId: "84616585057",
  appId: "1:84616585057:web:b44acc0904767752966f20",
  measurementId: "G-9Z77FSZKQR"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, serverTimestamp, writeBatch, increment, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = getFirestore(app); }

const DK=['sun','mon','tue','wed','thu','fri','sat'], MON=['mon','tue','wed','thu','fri','sat','sun'];
const DN={sun:'Minggu',mon:'Senin',tue:'Selasa',wed:'Rabu',thu:'Kamis',fri:'Jumat',sat:'Sabtu'};
const ANIMALS=['🐶','🐱','🐰','🐼','🦊','🐨','🐯','🦁','🐸','🐷','🐵','🐔','🐧','🦄','🐻','🐮'];
const COLORS=['#FF9AA2','#A2D2FF','#B5EAD7','#FFDAC1','#C7CEEA','#FFB7B2','#E2F0CB','#FFC8DD'];
const TICONS=['🛏️','💧','🦷','🧸','🧹','🍽️','👕','🚿','📚','🌱','🐶','🗑️','🧺','🍎','⭐','🎨'];
const RICONS=['🎁','🎮','🎬','🍦','🌳','🍕','📱','🎨','⚽','🎪','🍫','🧁','🚲','🎯','🎈','🏊'];

const state={uid:null,familyId:null,role:null,childId:null,family:null,children:[],tasks:[],rewards:[],schedules:{},overrides:{},completions:[],redemptions:[],ledger:[],unsubs:[],childTab:'today',parentTab:'approval',ed:{childId:null,day:'mon',mode:'perm'},pending:null};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr=()=>fmt(new Date()), todayKey=()=>DK[new Date().getDay()];
// tanggal hari tertentu pada minggu ini (Senin-Minggu)
const weekDate=dk=>{const n=new Date();const dow=(n.getDay()+6)%7;return fmt(new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow+MON.indexOf(dk)));};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const genFid=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let o='FAM-';for(let i=0;i<8;i++)o+=c[Math.floor(Math.random()*c.length)];return o;};
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('petualangan-hewan-v1:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
let tt;
function toast(m,t=''){const e=$('#toast');e.textContent=m;e.className='toast show '+t;clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2800);}
function showScreen(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id)?.classList.add('active');window.scrollTo(0,0);}
const openModal=h=>{$('#modal-content').innerHTML=h;$('#modal-root').classList.add('active');};
const closeModal=()=>$('#modal-root').classList.remove('active');
const getPairing=()=>{try{return JSON.parse(localStorage.getItem('animalRoutinePairing')||'null');}catch{return null;}};
const savePairing=p=>localStorage.setItem('animalRoutinePairing',JSON.stringify(p));
const fcol=n=>collection(db,'families',state.familyId,n);
const fdoc=(n,id)=>doc(db,'families',state.familyId,n,id);

onAuthStateChanged(auth,async user=>{
  if(!user||state.uid)return;
  state.uid=user.uid;
  const p=getPairing();
  if(!p){showScreen('screen-onboarding');return;}
  state.familyId=p.familyId;state.role=null;state.childId=null;
  try{const d=await getDoc(doc(db,'families',p.familyId,'devices',user.uid));if(!d.exists()){localStorage.removeItem('animalRoutinePairing');showScreen('screen-onboarding');return;}}catch(e){console.warn('offline',e);}
  startListeners();goLanding();
});
(async()=>{try{await signInAnonymously(auth);}catch(e){console.error(e);showScreen('screen-onboarding');toast('Gagal konek. Cek Firebase (Anonymous Auth) & internet.','error');}})();
function goLanding(){state.role=null;state.childId=null;closeModal();$('#land-fam').textContent=state.family?.name||'';showScreen('screen-landing');}
function enterParent(){state.role='parent';state.parentTab='approval';showScreen('screen-parent');renderParent();}
function enterChild(cid){state.role='child';state.childId=cid;state.childTab='today';showScreen('screen-child');renderChild();}
// kembali ke halaman awal jika app ditinggal > 2 menit
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(state.role&&hiddenAt&&Date.now()-hiddenAt>120000)goLanding();});

async function createFamily(name,pname,pin){
  const fid=genFid(),h=await hashPin(pin);
  await setDoc(doc(db,'families',fid),{name,createdAt:serverTimestamp(),version:2});
  await setDoc(doc(db,'families',fid,'private','pin'),{hash:h});
  await setDoc(doc(db,'families',fid,'devices',state.uid),{role:'parent',label:pname,pinHash:h,pairedAt:serverTimestamp()});
  savePairing({familyId:fid,role:'parent',childId:null});
  Object.assign(state,{familyId:fid,role:null,childId:null});
  const b=writeBatch(db);
  [['Rapikan tempat tidur','🛏️',2],['Minum air 8 gelas','💧',1],['Rapikan mainan','🧸',2],['Bantu menyapu','🧹',3]].forEach((t,i)=>b.set(fdoc('tasks','seed'+i),{name:t[0],icon:t[1],points:t[2],forChild:'all',active:true,sortOrder:i}));
  [['Main game 30 menit','🎮',10],['Nonton film','🎬',15],['Es krim','🍦',20],['Main ke taman','🌳',25]].forEach((r,i)=>b.set(fdoc('rewards','seed'+i),{name:r[0],icon:r[1],cost:r[2],active:true,sortOrder:i}));
  await b.commit();
  startListeners();toast('Keluarga dibuat! ID: '+fid,'success');goLanding();
}
async function joinFamily(fid){
  fid=fid.trim().toUpperCase();
  const s=await getDoc(doc(db,'families',fid));
  if(!s.exists())throw new Error('Keluarga tidak ditemukan');
  await setDoc(doc(db,'families',fid,'devices',state.uid),{role:'child',label:'HP',pairedAt:serverTimestamp()},{merge:true});
  savePairing({familyId:fid});
  Object.assign(state,{familyId:fid,role:null,childId:null});
  startListeners();toast('Berhasil bergabung!','success');goLanding();
}
async function parentLogin(pin){
  const h=await hashPin(pin);
  try{await setDoc(doc(db,'families',state.familyId,'devices',state.uid),{role:'parent',pinHash:h},{merge:true});}
  catch(e){console.error(e);throw new Error('PIN salah');}
  closeModal();enterParent();
}
function renderPick(){
  const l=state.children;
  $('#pick-list').innerHTML=l.length?l.map(c=>`<div class="child-card" data-action="pick-child" data-id="${c.id}"><div class="child-avatar" style="background:${c.color||'var(--soft)'}">${c.avatar||'🐶'}</div><div style="flex:1;font-weight:900;font-size:18px">${esc(c.name)}</div>→</div>`).join(''):`<div class="empty"><p>Belum ada anak.<br>Minta orang tua menambah anak dulu.</p></div>`;
}

function startListeners(){
  state.unsubs.forEach(u=>{try{u();}catch{}});state.unsubs=[];
  const sub=(ref,fn)=>state.unsubs.push(onSnapshot(ref,fn,e=>console.error(e)));
  const list=(k,sort)=>s=>{let a=s.docs.map(d=>({id:d.id,...d.data()}));if(sort)a.sort((x,y)=>(x.sortOrder??0)-(y.sortOrder??0));state[k]=a;rerender();};
  const map=k=>s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());state[k]=m;rerender();};
  sub(doc(db,'families',state.familyId),s=>{state.family=s.exists()?s.data():null;rerender();});
  sub(fcol('children'),list('children',1));sub(fcol('tasks'),list('tasks',1));sub(fcol('rewards'),list('rewards',1));
  sub(fcol('schedules'),map('schedules'));sub(fcol('overrides'),map('overrides'));
  sub(fcol('completions'),list('completions'));sub(fcol('redemptions'),list('redemptions'));sub(fcol('ledger'),list('ledger'));
}
function rerender(){
  if(state.role==='parent')renderParent();else if(state.role==='child')renderChild();
  else{const l=$('#land-fam');if(l)l.textContent=state.family?.name||'';if($('#screen-pick-child').classList.contains('active'))renderPick();}
}

const child=id=>state.children.find(c=>c.id===id);
const byStart=(a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99');
// jadwal efektif: override tanggal tsb (jika ada), kalau tidak template mingguan
function getSched(cid,dk){
  const ov=state.overrides[`${weekDate(dk)}_${cid}`];

}
const hasOv=(cid,dk)=>!!state.overrides[`${weekDate(dk)}_${cid}`];
const getComp=(cid,tid,date)=>state.completions.find(c=>c.childId===cid&&c.taskId===tid&&c.date===date&&c.status!=='rejected');
const myTasks=cid=>state.tasks.filter(t=>t.active!==false&&(!t.forChild||t.forChild==='all'||t.forChild===cid));

function schedTable(items,edit){

  return `<div style="overflow-x:auto"><table class="st"><thead><tr><th>No</th><th>Waktu</th><th>Kegiatan</th><th>Keterangan</th>${edit?'<th></th>':''}</tr></thead><tbody>${items.map((a,i)=>`<tr><td>${i+1}</td><td class="tm">${a.start||'-'}${a.end?'<br>'+a.end:''}</td><td><b>${esc(a.title)}</b></td><td class="nt">${esc(a.notes)}</td>${edit?`<td class="ac"><button class="ib ok" data-action="edit-item" data-id="${a.id}">✎</button><button class="ib no" data-action="del-item" data-id="${a.id}">🗑</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;

/* ===== AKSI POIN ===== */
async function completeTask(tid){
  const c=child(state.childId),t=state.tasks.find(x=>x.id===tid),d=todayStr();
  if(!c||!t||getComp(c.id,tid,d))return;
  await setDoc(doc(fcol('completions')),{childId:c.id,taskId:tid,taskName:t.name,date:d,status:'pending',createdAt:serverTimestamp()});
  toast('Terkirim! Menunggu persetujuan','success');
}
async function redeem(rid){
  const c=child(state.childId),r=state.rewards.find(x=>x.id===rid);
  if(!c||!r)return;
  if((c.balance||0)<r.cost)throw new Error('Poin belum cukup');
  if(state.redemptions.find(x=>x.childId===c.id&&x.rewardId===rid&&x.status==='pending'))throw new Error('Sudah ada permintaan yang sama');
  await setDoc(doc(fcol('redemptions')),{childId:c.id,rewardId:rid,rewardName:r.name,cost:r.cost,status:'pending',createdAt:serverTimestamp()});
  toast('Permintaan dikirim!','success');
}
async function approveTask(id){
  const x=state.completions.find(k=>k.id===id);
  if(!x||x.status!=='pending')return;
  const pts=state.tasks.find(t=>t.id===x.taskId)?.points||0; // poin diambil dari data tugas, bukan dari anak
  const b=writeBatch(db);
  b.update(fdoc('completions',id),{status:'approved',points:pts,reviewedAt:serverTimestamp()});
  if(pts>0){b.update(fdoc('children',x.childId),{balance:increment(pts)});b.set(doc(fcol('ledger')),{childId:x.childId,delta:pts,type:'earn',note:x.taskName,refId:id,createdAt:serverTimestamp()});}
  await b.commit();toast('Disetujui! +'+pts+' poin','success');
}
async function approveRedemption(id){
  const r=state.redemptions.find(k=>k.id===id);
  if(!r||r.status!=='pending')return;
  const rw=state.rewards.find(k=>k.id===r.rewardId),cost=rw?.cost??r.cost;
  if((child(r.childId)?.balance||0)<cost)throw new Error('Poin anak tidak cukup');
  const b=writeBatch(db);
  b.update(fdoc('redemptions',id),{status:'approved',reviewedAt:serverTimestamp()});
  b.update(fdoc('children',r.childId),{balance:increment(-cost)});
  b.set(doc(fcol('ledger')),{childId:r.childId,delta:-cost,type:'redeem',note:r.rewardName,refId:id,createdAt:serverTimestamp()});
  await b.commit();toast('Hadiah disetujui!','success');
}
const reject=async(col,id)=>{await updateDoc(fdoc(col,id),{status:'rejected',reviewedAt:serverTimestamp()});toast('Ditolak','error');};
async function del(col,id){if(!confirm('Hapus item ini?'))return;await deleteDoc(fdoc(col,id));toast('Dihapus','success');}

document.body.addEventListener('click',async e=>{
  const pk=e.target.closest('[data-pick]');
  if(pk){const k=pk.dataset.pick;$$(`#modal-content [data-pick="${k}"]`).forEach(b=>b.classList.toggle('selected',b===pk));$(`#modal-content input[name="${k}"]`).value=pk.dataset.v;return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  try{
    switch(a){
      case 'go-create':showScreen('screen-create');break;
      case 'go-join':showScreen('screen-join');break;
      case 'back':state.pending=null;showScreen('screen-onboarding');break;
      case 'close-modal-bg':if(e.target.id==='modal-root')closeModal();break;
      case 'close-modal':closeModal();break;
      case 'child-tab':state.childTab=el.dataset.tab;renderChild();break;
      case 'parent-tab':state.parentTab=el.dataset.tab;renderParent();break;
      case 'land-parent':openModal(`<h3>🔒 PIN Orang Tua</h3><form id="form-plogin"><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required maxlength="6" placeholder="••••" autofocus><button type="submit" class="btn btn-primary">Masuk</button><button type="button" class="btn btn-ghost" data-action="close-modal">Batal</button></form>`);break;
      case 'land-child':renderPick();showScreen('screen-pick-child');break;
      case 'pick-child':enterChild(id);break;
      case 'go-landing':goLanding();break;
      case 'complete-task':await completeTask(id);break;
      case 'redeem-reward':await redeem(id);break;
      case 'approve-task':await approveTask(id);break;
      case 'reject-task':await reject('completions',id);break;
      case 'approve-redemption':await approveRedemption(id);break;
      case 'reject-redemption':await reject('redemptions',id);break;
      case 'sched-child':state.ed.childId=id;renderParent();break;
      case 'sched-day':state.ed.day=el.dataset.day;renderParent();break;
      case 'sched-mode':state.ed.mode=el.dataset.mode;renderParent();break;
      case 'add-item':itemModal();break;
      case 'edit-item':itemModal(id);break;
      case 'del-item':if(confirm('Hapus kegiatan ini dari jadwal?'))await saveItems(curItems().filter(x=>x.id!==id));break;
      case 'reset-ov':await deleteDoc(fdoc('overrides',`${weekDate(state.ed.day)}_${state.ed.childId}`));toast('Kembali ke jadwal normal','success');break;
      case 'copy-day':copyModal();break;
      case 'add-task':taskModal();break;
      case 'edit-task':taskModal(id);break;
      case 'del-task':await del('tasks',id);break;
      case 'add-reward':rewardModal();break;
      case 'edit-reward':rewardModal(id);break;
      case 'del-reward':await del('rewards',id);break;
      case 'add-child':childModal();break;
      case 'edit-child':childModal(id);break;
      case 'del-child':await del('children',id);break;
      case 'copy-fid':try{await navigator.clipboard.writeText(state.familyId);toast('ID disalin!','success');}catch{toast('Gagal salin','error');}break;
      case 'change-family-name':openModal(`<h3>Ganti Nama Keluarga</h3><form id="form-fname"><input name="name" required maxlength="40" value="${esc(state.family?.name||'')}"><button type="submit" class="btn btn-primary">Simpan</button><button type="button" class="btn btn-ghost" data-action="close-modal">Batal</button></form>`);break;
      case 'change-pin':openModal(`<h3>Ganti PIN</h3><form id="form-pin"><label>PIN Lama</label><input name="old" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required><label>PIN Baru</label><input name="new" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required><button type="submit" class="btn btn-primary" style="margin-top:12px">Simpan</button><button type="button" class="btn btn-ghost" data-action="close-modal">Batal</button></form>`);break;
      case 'reset-device':if(confirm('Keluar dari keluarga di HP ini? Data di cloud tidak hilang.')){localStorage.removeItem('animalRoutinePairing');location.reload();}break;
    }
  }catch(err){console.error(err);toast(err.message||'Terjadi kesalahan','error');}
});

document.body.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target,v=Object.fromEntries(new FormData(f)),fid=f.id,eid=f.dataset.id;
  try{
    if(fid==='form-create'){const pin=$('#c-pin').value;if(pin!==$('#c-pin2').value)throw new Error('PIN tidak sama');if(!/^\d{4,6}$/.test(pin))throw new Error('PIN harus 4-6 angka');await createFamily($('#c-fam').value.trim(),$('#c-name').value.trim(),pin);}
    else if(fid==='form-join')await joinFamily($('#j-fid').value);
    else if(fid==='form-plogin')await parentLogin(v.pin);
    else if(fid==='form-item'){
      let items=curItems();const it={id:eid||uid(),start:v.start||'',end:v.end||'',title:v.title.trim(),notes:(v.notes||'').trim()};
      items=eid?items.map(x=>x.id===eid?it:x):[...items,it];
      await saveItems(items.sort(byStart));closeModal();
    }
    else if(fid==='form-copy'){
      const days=new FormData(f).getAll('d');if(!days.length)throw new Error('Pilih minimal satu hari');
      const items=curItems(),cur={};days.forEach(d=>cur[d]=items);
      await setDoc(fdoc('schedules',state.ed.childId),{days:cur,updatedAt:serverTimestamp()},{merge:true});closeModal();toast('Jadwal disalin','success');
    }
    else if(fid==='form-task'){
      const d={name:v.name.trim(),icon:v.icon,points:parseInt(v.points,10)||0,forChild:v.forChild||'all',active:!!v.active};
      if(eid)await updateDoc(fdoc('tasks',eid),d);else await setDoc(doc(fcol('tasks')),{...d,sortOrder:state.tasks.length});
      closeModal();toast('Tugas disimpan','success');
    }
    else if(fid==='form-reward'){
      const d={name:v.name.trim(),icon:v.icon,cost:parseInt(v.cost,10)||1,active:!!v.active};
      if(eid)await updateDoc(fdoc('rewards',eid),d);else await setDoc(doc(fcol('rewards')),{...d,sortOrder:state.rewards.length});
      closeModal();toast('Hadiah disimpan','success');
    }
    else if(fid==='form-child'){
      const d={name:v.name.trim(),avatar:v.avatar,color:v.color,active:true};
      if(eid)await updateDoc(fdoc('children',eid),d);else await setDoc(doc(fcol('children')),{...d,sortOrder:state.children.length,balance:0});
      closeModal();toast('Data anak disimpan','success');
    }
    else if(fid==='form-fname'){await updateDoc(doc(db,'families',state.familyId),{name:v.name.trim()});closeModal();toast('Nama diubah','success');}
    else if(fid==='form-pin'){
      if(!/^\d{4,6}$/.test(v.new))throw new Error('PIN baru harus 4-6 angka');
      const me=await getDoc(doc(db,'families',state.familyId,'devices',state.uid));
      if(me.data()?.pinHash!==await hashPin(v.old))throw new Error('PIN lama salah');
      const h=await hashPin(v.new);
      await updateDoc(doc(db,'families',state.familyId,'private','pin'),{hash:h});
      await updateDoc(doc(db,'families',state.familyId,'devices',state.uid),{pinHash:h});
      closeModal();toast('PIN diubah','success');
    }
  }catch(err){console.error(err);toast(err.message||'Gagal','error');}
});
</script>
